# ============================================================================
# Snippet compartido del ERP — servido por default.conf.template (HTTP) y
# tls.conf (HTTPS, perfil server). UNA sola fuente para la lógica de la SPA:
# si cambia el procedimiento, cambia este archivo en el mismo diff.
# ============================================================================

    # Charset global
    charset utf-8;

    # SPA: servir estáticos y reescribir el resto a index.html (rutas de React)
    location / {
        try_files $uri $uri/ /index.html;

        # Sin cache en producción: la SPA siempre descarga el index fresco
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Archivos estáticos con hash en el nombre (Vite): cache agresiva
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Configuración de logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
