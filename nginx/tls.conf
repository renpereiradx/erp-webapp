# ============================================================================
# ERP Vista Bar — nginx HTTPS (perfil server, RN-DEPLOY-001/002/006)
# ============================================================================
# Este archivo NO se renderiza al build de la imagen: el compose del perfil
# `server` lo monta sobre /etc/nginx/conf.d/default.conf (una sola imagen FE
# sirve laptop y server; solo cambia la config montada).
#
#   volumes:
#     - ../erp-webapp/nginx/tls.conf:/etc/nginx/conf.d/default.conf:ro
#     - ./deploy/certs/server:/etc/nginx/certs:ro
#
# Certificados: CA interna generada por el instalador
# (business_management/deploy/scripts/gen-ca.sh). Terminales del cliente
# confían en ca.crt (ver GUIDE_TERMINALES_LOCAL).
# ============================================================================

# HTTP → HTTPS (todo; no hay nada útil en :80 del perfil server)
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Certificados del servidor (montados por compose desde deploy/certs/server)
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:ERP_SSL:10m;
    ssl_session_timeout 1h;

    # Endurecimiento básico (RN-DEPLOY-006)
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/erp-app.conf;

    # Proxy inverso /api de origen único (D1 / RN-DEPLOY-001).
    # En perfil server el upstream es siempre el servicio compose `backend`.
    location /api/ {
        proxy_pass http://backend:8080/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 50m;
    }
}
