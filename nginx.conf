server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Habilitar charset UTF-8 para todos los archivos servidos
    charset utf-8;

    # Servir archivos estáticos del frontend
    location / {
        try_files $uri $uri/ /index.html;
        
        # Headers para prevenir cache en producción
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # F7.7: proxy /api eliminado — el frontend ahora usa URL directa al backend
    # (VITE_API_URL en .env.production apunta al backend real). Nginx solo sirve
    # la SPA. Si se necesita reactivar proxy inverso, restaurar el bloque
    # `location /api/` con `rewrite ^/api/(.*)$ /$1 break;` y volver a
    # VITE_API_URL=/api.

    # Configuración de logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
}
